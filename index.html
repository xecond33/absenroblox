<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard AbsensiMap">
  <title>Dashboard — AbsensiMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="global-loader">
    <div class="loading-spinner"></div>
  </div>

  <div class="app" id="app-container" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">📋</span>
          <h1>AbsensiMap</h1>
        </div>
        <div class="header-actions">
          <a href="admin.html" class="btn btn-ghost btn-sm" id="btn-admin-link" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>Admin Panel</span>
          </a>
          <div class="header-user">
            <div class="header-user-avatar" id="user-avatar-initial">U</div>
            <span id="user-name-display">User</span>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-logout" title="Keluar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Greeting Section -->
    <section class="greeting-section">
      <div class="greeting-card">
        <h2 class="greeting-title" id="greeting-title">Halo, User!</h2>
        <p class="greeting-subtitle">Selamat datang kembali. Mari selesaikan target absensimu.</p>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon stat-icon-total">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total Item</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-running">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-running">0</span>
            <span class="stat-label">Berjalan</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-done">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-done">0</span>
            <span class="stat-label">Selesai</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-attendance">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-today">0/0</span>
            <span class="stat-label">Absen Hari Ini</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Today's Attendance -->
    <section class="today-section">
      <h3 class="section-title">
        <span class="section-title-icon">📅</span> Absensi Hari Ini
      </h3>
      <div class="today-grid">
        <!-- Belum Absen -->
        <div class="today-column">
          <div class="today-column-header pending">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Belum Absen
          </div>
          <div id="today-pending-list" class="today-list">
            <!-- Rendered by JS -->
          </div>
        </div>
        <!-- Sudah Absen -->
        <div class="today-column">
          <div class="today-column-header completed">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Sudah Absen
          </div>
          <div id="today-completed-list" class="today-list">
             <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- Filters & Search -->
    <section class="controls-section">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Cari nama map atau absensi..." autocomplete="off">
      </div>
      <div class="filter-chips" id="filter-chips">
        <button class="chip active" data-filter="all">Semua</button>
        <button class="chip" data-filter="7">7 Hari</button>
        <button class="chip" data-filter="14">14 Hari</button>
        <button class="chip" data-filter="30">30 Hari</button>
        <button class="chip" data-filter="running">Berjalan</button>
        <button class="chip" data-filter="done">Selesai</button>
      </div>
    </section>

    <!-- Cards Grid -->
    <main class="cards-section">
      <div class="cards-grid" id="cards-grid">
        <!-- Cards rendered by JS -->
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <p>Tidak ada data ditemukan</p>
        <span>Ubah filter atau tunggu admin menambahkan item.</span>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>

</html>
