<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Website absensi sederhana untuk mencatat dan melacak kehadiran dengan durasi 7, 14, atau 30 hari. Tanpa database, data tersimpan di browser.">
  <title>Absen Map — Pelacak Absensi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">📋</span>
          <h1>AbsensiMap</h1>
          <span class="sync-badge" id="sync-badge">Memuat…</span>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost" id="btn-reset-all" title="Reset Semua Absensi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
            <span class="btn-label">Reset Semua</span>
          </button>
          <button class="btn btn-primary" id="btn-add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span>Tambah</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Stats -->
    <section class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon stat-icon-total">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total Item</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-running">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-running">0</span>
            <span class="stat-label">Berjalan</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-done">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-done">0</span>
            <span class="stat-label">Selesai</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-attendance">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="stat-attendance">0</span>
            <span class="stat-label">Absensi</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Filters & Search -->
    <section class="controls-section">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="search-input" placeholder="Cari nama..." autocomplete="off">
      </div>
      <div class="filter-chips" id="filter-chips">
        <button class="chip active" data-filter="all">Semua</button>
        <button class="chip" data-filter="7">7 Hari</button>
        <button class="chip" data-filter="14">14 Hari</button>
        <button class="chip" data-filter="30">30 Hari</button>
        <button class="chip" data-filter="running">Berjalan</button>
        <button class="chip" data-filter="done">Selesai</button>
      </div>
    </section>

    <!-- Cards Grid -->
    <main class="cards-section">
      <div class="cards-grid" id="cards-grid">
        <!-- Cards rendered by JS -->
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <p>Tidak ada data ditemukan</p>
        <span>Tambahkan item baru atau ubah filter.</span>
      </div>
    </main>
  </div>

  <!-- Modal: Add/Edit -->
  <div class="modal-overlay" id="modal-form" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-form-title">Tambah Item</h2>
        <button class="modal-close" id="modal-form-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="input-name">Nama</label>
          <input type="text" id="input-name" placeholder="Masukkan nama..." autocomplete="off">
        </div>
        <div class="form-group">
          <label for="input-duration">Durasi Absensi</label>
          <div class="duration-options" id="duration-options">
            <button class="duration-btn" data-duration="7">7 Hari</button>
            <button class="duration-btn" data-duration="14">14 Hari</button>
            <button class="duration-btn active" data-duration="30">30 Hari</button>
          </div>
        </div>
        <div class="form-group">
          <label for="input-note">Keterangan (opsional)</label>
          <textarea id="input-note" rows="2" placeholder="Catatan tambahan, misal jadwal atau info lain..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-form-cancel">Batal</button>
        <button class="btn btn-primary" id="modal-form-save">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal: Confirm -->
  <div class="modal-overlay" id="modal-confirm" aria-hidden="true">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 id="modal-confirm-title">Konfirmasi</h2>
        <button class="modal-close" id="modal-confirm-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-confirm-msg">Yakin?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-confirm-cancel">Batal</button>
        <button class="btn btn-danger" id="modal-confirm-ok">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- Modal: Day Grid -->
  <div class="modal-overlay" id="modal-days" aria-hidden="true">
    <div class="modal modal-days">
      <div class="modal-header">
        <h2 id="modal-days-title">Absensi</h2>
        <button class="modal-close" id="modal-days-close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="days-note" id="modal-days-note" style="display:none;"></p>
        <div class="days-today-badge-wrap">
          <span class="today-badge" id="modal-days-today-badge"></span>
        </div>
        <div class="days-progress-bar-wrap">
          <div class="days-progress-info">
            <span id="modal-days-progress-text">0/0</span>
            <span id="modal-days-progress-pct">0%</span>
          </div>
          <div class="days-progress-bar">
            <div class="days-progress-fill" id="modal-days-progress-fill"></div>
          </div>
        </div>
        <div class="days-grid" id="days-grid">
          <!-- Rendered by JS -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-days-reset">Reset Absensi</button>
        <button class="btn btn-primary" id="modal-days-done">Selesai</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>

</html>
