<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login atau daftar akun AbsensiMap untuk mulai tracking absensi Anda.">
  <title>Login — AbsensiMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
  <div class="auth-container">
    <!-- Decorative Background -->
    <div class="auth-bg-orb auth-bg-orb-1"></div>
    <div class="auth-bg-orb auth-bg-orb-2"></div>
    <div class="auth-bg-orb auth-bg-orb-3"></div>

    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <span class="auth-logo-icon">📋</span>
        <h1>AbsensiMap</h1>
        <p>Lacak kehadiran kamu dengan mudah</p>
      </div>

      <!-- Tab Toggle -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" data-tab="login">Masuk</button>
        <button class="auth-tab" id="tab-register" data-tab="register">Daftar</button>
        <div class="auth-tab-indicator" id="tab-indicator"></div>
      </div>

      <!-- Error Message -->
      <div class="auth-error" id="auth-error" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="15" y1="9" x2="9" y2="15" />
          <line x1="9" y1="9" x2="15" y2="15" />
        </svg>
        <span id="auth-error-text"></span>
      </div>

      <!-- Success Message -->
      <div class="auth-success" id="auth-success" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
        <span id="auth-success-text"></span>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="form-login" autocomplete="off">
        <div class="form-group">
          <label for="login-email">Email</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input type="email" id="login-email" placeholder="nama@email.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="login-password" placeholder="Masukkan password" required minlength="6">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="btn-login">
          <span class="btn-text">Masuk</span>
          <div class="btn-spinner" style="display:none;"></div>
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="form-register" style="display:none;" autocomplete="off">
        <div class="form-group">
          <label for="register-username">Username</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" id="register-username" placeholder="Username unik" required minlength="3">
          </div>
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input type="email" id="register-email" placeholder="nama@email.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="register-password" placeholder="Minimal 6 karakter" required minlength="6">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-auth" id="btn-register">
          <span class="btn-text">Daftar</span>
          <div class="btn-spinner" style="display:none;"></div>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <p class="auth-footer">AbsensiMap &copy; 2026</p>
  </div>

  <script src="auth.js"></script>
  <script>
    (function () {
      'use strict';

      const $tabLogin = document.getElementById('tab-login');
      const $tabRegister = document.getElementById('tab-register');
      const $tabIndicator = document.getElementById('tab-indicator');
      const $formLogin = document.getElementById('form-login');
      const $formRegister = document.getElementById('form-register');
      const $authError = document.getElementById('auth-error');
      const $authErrorText = document.getElementById('auth-error-text');
      const $authSuccess = document.getElementById('auth-success');
      const $authSuccessText = document.getElementById('auth-success-text');

      let currentTab = 'login';

      // ---- Init: Redirect if already authenticated ----
      (async () => {
        await Auth.redirectIfAuthenticated();
        document.body.classList.add('loaded');
      })();

      // ---- Tab Switching ----
      function switchTab(tab) {
        currentTab = tab;
        hideMessages();

        if (tab === 'login') {
          $tabLogin.classList.add('active');
          $tabRegister.classList.remove('active');
          $formLogin.style.display = '';
          $formRegister.style.display = 'none';
          $tabIndicator.style.left = '0%';
        } else {
          $tabLogin.classList.remove('active');
          $tabRegister.classList.add('active');
          $formLogin.style.display = 'none';
          $formRegister.style.display = '';
          $tabIndicator.style.left = '50%';
        }
      }

      $tabLogin.addEventListener('click', () => switchTab('login'));
      $tabRegister.addEventListener('click', () => switchTab('register'));

      // ---- Messages ----
      function showError(msg) {
        $authErrorText.textContent = msg;
        $authError.style.display = '';
        $authSuccess.style.display = 'none';
      }

      function showSuccess(msg) {
        $authSuccessText.textContent = msg;
        $authSuccess.style.display = '';
        $authError.style.display = 'none';
      }

      function hideMessages() {
        $authError.style.display = 'none';
        $authSuccess.style.display = 'none';
      }

      // ---- Loading State ----
      function setLoading(btn, loading) {
        const text = btn.querySelector('.btn-text');
        const spinner = btn.querySelector('.btn-spinner');
        if (loading) {
          text.style.display = 'none';
          spinner.style.display = '';
          btn.disabled = true;
        } else {
          text.style.display = '';
          spinner.style.display = 'none';
          btn.disabled = false;
        }
      }

      // ---- Login ----
      $formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login');

        if (!email || !password) {
          showError('Mohon isi semua field.');
          return;
        }

        setLoading(btn, true);
        const { data, error } = await Auth.login(email, password);
        setLoading(btn, false);

        if (error) {
          showError(error.message === 'Invalid login credentials'
            ? 'Email atau password salah.'
            : error.message);
          return;
        }

        window.location.href = 'index.html';
      });

      // ---- Register ----
      $formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessages();

        const username = document.getElementById('register-username').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;
        const btn = document.getElementById('btn-register');

        if (!username || !email || !password) {
          showError('Mohon isi semua field.');
          return;
        }

        if (username.length < 3) {
          showError('Username minimal 3 karakter.');
          return;
        }

        if (password.length < 6) {
          showError('Password minimal 6 karakter.');
          return;
        }

        setLoading(btn, true);
        const { data, error } = await Auth.register(email, password, username);
        setLoading(btn, false);

        if (error) {
          showError(error.message);
          return;
        }

        // Check if email confirmation is required
        if (data?.user?.identities?.length === 0) {
          showError('Email sudah terdaftar.');
          return;
        }

        showSuccess('Akun berhasil dibuat! Silakan masuk.');
        switchTab('login');
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').focus();
      });

    })();
  </script>
</body>

</html>
