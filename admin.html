<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Panel AbsensiMap">
  <title>Admin Panel — AbsensiMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="global-loader">
    <div class="loading-spinner"></div>
  </div>

  <div class="app" id="app-container" style="display: none;">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">📋</span>
          <h1>Admin Panel</h1>
        </div>
        <div class="header-actions">
          <a href="index.html" class="btn btn-ghost btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span>Kembali ke Dashboard</span>
          </a>
        </div>
      </div>
    </header>

    <section class="admin-section">
      <!-- Admin Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-target="panel-items">Kelola Absensi</button>
        <button class="admin-tab" data-target="panel-users">Data Pengguna</button>
      </div>

      <!-- Panel: Manage Items -->
      <div class="admin-panel active" id="panel-items">
        <div class="admin-toolbar">
          <h2 class="section-title" style="margin:0;">Daftar Item Absensi</h2>
          <button class="btn btn-primary" id="btn-add-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Tambah Item</span>
          </button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Map Name</th>
                <th>Durasi (Hari)</th>
                <th>Wajib Stay (Menit)</th>
                <th style="width:100px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="table-items-body">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Panel: Manage Users -->
      <div class="admin-panel" id="panel-users">
        <div class="admin-toolbar">
          <h2 class="section-title" style="margin:0;">Daftar Pengguna</h2>
        </div>
        <div class="user-progress-grid" id="users-grid">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>
  </div>

  <!-- Modal: Item Form -->
  <div class="modal-overlay" id="modal-item" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-item-title">Tambah Item</h2>
        <button class="modal-close" id="modal-item-close">&times;</button>
      </div>
      <form id="form-item">
        <div class="modal-body">
          <div class="form-group">
            <label for="input-name">Nama Absensi</label>
            <input type="text" id="input-name" placeholder="Contoh: 404" required>
          </div>
          <div class="form-group">
            <label for="input-map">Nama Map</label>
            <input type="text" id="input-map" placeholder="Contoh: 404 Map" required>
          </div>
          <div class="form-group">
            <label for="input-duration">Durasi (Hari)</label>
            <select id="input-duration" required>
              <option value="7">7 Hari</option>
              <option value="14">14 Hari</option>
              <option value="30" selected>30 Hari</option>
            </select>
          </div>
          <div class="form-group">
            <label for="input-minutes">Wajib Stay (Menit)</label>
            <input type="number" id="input-minutes" min="1" placeholder="Contoh: 30" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="modal-item-cancel">Batal</button>
          <button type="submit" class="btn btn-primary" id="btn-save-item">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: User Progress Detail -->
  <div class="modal-overlay" id="modal-user" aria-hidden="true">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="modal-user-title">Progress User</h2>
        <button class="modal-close" id="modal-user-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Item Absensi</th>
                <th>Status</th>
                <th>Progress</th>
              </tr>
            </thead>
            <tbody id="table-user-progress-body">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Confirm Delete -->
  <div class="modal-overlay" id="modal-confirm" aria-hidden="true">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Konfirmasi</h2>
        <button class="modal-close" id="modal-confirm-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-confirm-msg">Yakin ingin menghapus item ini?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-confirm-cancel">Batal</button>
        <button class="btn btn-danger" id="modal-confirm-ok">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="auth.js"></script>
  <script src="admin.js"></script>
</body>

</html>
